name: Publish compiled downloads
on:
  push:
    branches: [main]
    paths: ['apg-landscape-update.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish compiled files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $v=(Get-Content apg-landscape-update.json -Raw|ConvertFrom-Json).version
          foreach($year in @('2024','2025')){
            $meta=if($year -eq '2024'){'apg-landscape-update.json'}else{'apg-landscape-update-2025.json'}
            $m=Get-Content $meta -Raw|ConvertFrom-Json
            if($m.version -ne $v -or $m.revitVersion -ne $year){throw 'Host/version mismatch'}
            if((Get-FileHash $m.packageAssetName).Hash.ToLowerInvariant() -ne $m.packageSha256){throw 'Package checksum mismatch'}
            $folder=Join-Path $env:RUNNER_TEMP $year
            Expand-Archive $m.packageAssetName $folder
            if((Get-FileHash (Join-Path $folder 'APGLandscape.dll')).Hash.ToLowerInvariant() -ne $m.dllSha256){throw 'DLL checksum mismatch'}
          }
          gh release create "v$v" LandscapeToolsSetup.exe APGLandscapeSetup.exe APG-Landscape-Revit2024-payload.zip APG-Landscape-Revit2025-payload.zip apg-landscape-update.json apg-landscape-update-2025.json --target "$env:GITHUB_SHA" --title "Landscape Tools v$v" --notes-file RELEASE-NOTES.md --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
